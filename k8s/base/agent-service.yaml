apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-service
  template:
    metadata:
      labels:
        app: agent-service
    spec:
      containers:
        - name: agent-service
          image: ghcr.io/netrashivakumar/hkhr-agent-service:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:5001"
          envFrom:
            - secretRef:
                name: hkhr-secrets
            - configMapRef:
                name: hkhr-config
---
apiVersion: v1
kind: Service
metadata:
  name: agent-service
spec:
  selector:
    app: agent-service
  ports:
    - port: 8000
      targetPort: 8000

apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: ghcr.io/netrashivakumar/hkhr-inventory-service:dev
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "5002"
          envFrom:
            - secretRef:
                name: hkhr-secrets
---

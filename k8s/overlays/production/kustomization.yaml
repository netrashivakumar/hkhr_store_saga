apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: STREAM_PREFIX
          value: "prod:"

configMapGenerator:
  - name: hkhr-config
    options:
      disableNameSuffixHash: true
    literals:
      - ALLOWED_ORIGINS=*
      - ORDER_API_URL=https://zany-fiesta-5g775rgxwpv3xv9-5001.app.github.dev
      - WAKE_URLS=
